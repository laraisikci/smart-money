name: Keep-alive ping

# Pings the backend's /health endpoint every 10 minutes so Railway sees regular traffic and
# doesn't spin the service down for inactivity. Also doubles as a lightweight uptime check —
# the job fails (and GitHub emails/notifies on failure) if the backend doesn't respond.
#
# Requires a repository variable named RAILWAY_BACKEND_URL set to the deployed backend's base
# URL (e.g. https://smart-money-server-production.up.railway.app, no trailing slash). Set it at
# Settings -> Secrets and variables -> Actions -> Variables in this repo.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check RAILWAY_BACKEND_URL is set
        run: |
          if [ -z "${{ vars.RAILWAY_BACKEND_URL }}" ]; then
            echo "::error::RAILWAY_BACKEND_URL repository variable is not set. Go to Settings > Secrets and variables > Actions > Variables and add it (e.g. https://your-app.up.railway.app)."
            exit 1
          fi

      - name: Ping /health
        run: |
          url="${{ vars.RAILWAY_BACKEND_URL }}/health"
          echo "Pinging $url"
          response=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 20 "$url")
          echo "HTTP status: $response"
          cat /tmp/health.json
          if [ "$response" != "200" ]; then
            echo "::error::Health check failed with HTTP $response"
            exit 1
          fi
          if ! grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health.json; then
            echo "::error::Health check responded 200 but body didn't contain {\"status\":\"ok\"}"
            exit 1
          fi
